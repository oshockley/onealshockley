# Netlify runs the zero-dependency build and publishes dist/.
[build]
  command = "node scripts/build.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Old URL from the previous site
[[redirects]]
  from = "/thank-you.html"
  to = "/thank-you/"
  status = 301

# Fonts + images are versioned with ?v=<hash>, so they can be cached for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
